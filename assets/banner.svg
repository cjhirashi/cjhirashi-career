<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="gradient-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#gradient-cyan)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="40" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1100" cy="320" r="60" fill="rgba(255,255,255,0.08)"/>
  <rect x="950" y="30" width="180" height="180" rx="20" fill="rgba(255,255,255,0.05)"/>

  <!-- MCP Server Icon -->
  <g transform="translate(120, 120)">
    <!-- Server box -->
    <rect x="10" y="20" width="100" height="120" rx="8" fill="none" stroke="white" stroke-width="2.5" filter="url(#shadow)"/>

    <!-- Server ports/circles -->
    <circle cx="25" cy="40" r="5" fill="white"/>
    <circle cx="95" cy="40" r="5" fill="white"/>
    <circle cx="25" cy="70" r="5" fill="white"/>
    <circle cx="95" cy="70" r="5" fill="white"/>
    <circle cx="25" cy="100" r="5" fill="white"/>
    <circle cx="95" cy="100" r="5" fill="white"/>
    <circle cx="25" cy="130" r="5" fill="white"/>
    <circle cx="95" cy="130" r="5" fill="white"/>

    <!-- Center indicator -->
    <line x1="50" y1="30" x2="50" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Signal waves -->
    <circle cx="140" cy="80" r="8" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <circle cx="155" cy="80" r="13" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Title and Description -->
  <text x="380" y="130" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" letter-spacing="-0.5">
    MCP Tools Server
  </text>

  <text x="380" y="190" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)" font-weight="300" letter-spacing="0.5">
    Servidor de Herramientas Extensible
  </text>

  <text x="380" y="235" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" font-weight="300">
    FastMCP • WeasyPrint • Jinja2
  </text>

  <!-- Accent line -->
  <line x1="380" y1="250" x2="550" y2="250" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
</svg>