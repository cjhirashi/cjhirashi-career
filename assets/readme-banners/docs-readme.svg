<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" width="1200" height="400">
  <defs>
    <!-- Gradiente principal: Cyan → Teal -->
    <linearGradient id="gradient-docs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a5f75;stop-opacity:1" />
    </linearGradient>

    <!-- Estilos de fuentes -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

      .title {
        font-family: 'Inter', sans-serif;
        font-size: 72px;
        font-weight: 700;
        fill: white;
      }

      .description {
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 300;
        fill: white;
      }

      .type-badge {
        font-family: 'Inter', sans-serif;
        font-size: 40px;
        font-weight: 700;
        fill: white;
      }

      .footer-text {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: white;
      }

      .separator {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: white;
      }
    </style>
  </defs>

  <!-- Fondo gradiente -->
  <rect width="1200" height="400" fill="url(#gradient-docs)" />

  <!-- Línea divisor superior (para separar contenido del footer) -->
  <line x1="24" y1="320" x2="1176" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Footer gris -->
  <rect y="320" width="1200" height="80" fill="#4A4A4A" />

  <!-- Tipo/Badge (esquina superior derecha) -->
  <text x="1150" y="60" text-anchor="end" class="type-badge" opacity="0.3">DOCS</text>

  <!-- Título -->
  <text x="40" y="100" class="title">Documentation</text>

  <!-- Descripción -->
  <text x="40" y="160" class="description">Complete guides, API reference, and</text>
  <text x="40" y="195" class="description">troubleshooting for all components</text>

  <!-- Línea decorativa bajo descripción -->
  <line x1="40" y1="220" x2="320" y2="220" stroke="white" stroke-width="2" opacity="0.6" />

  <!-- Footer: Tecnologías | Ruta README -->
  <text x="40" y="348" class="footer-text">Markdown • Mermaid • HTML • CSS • Guides  |  docs/README.md</text>
</svg>
