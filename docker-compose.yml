services:
  mcp-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - /mnt/disco2/cjhirashi-data/mcp-outputs:/mnt/disco2/cjhirashi-data/mcp-outputs
    networks:
      - network-cjhirashi-srv
    environment:
      - PYTHONUNBUFFERED=1
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

  mcp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "8003:8000"
    volumes:
      # Solo lectura: nginx sirve los PDFs generados por mcp-tools bajo
      # /files/<carpeta>/ (ver frontend/nginx.conf.template) sin necesidad
      # de un endpoint HTTP adicional en server.py.
      - /mnt/disco2/cjhirashi-data/mcp-outputs:/mnt/disco2/cjhirashi-data/mcp-outputs:ro
    networks:
      - network-cjhirashi-srv
    environment:
      - APP_NAME=MCP Tools Server
      # Host:puerto INTERNO del contenedor mcp-tools (nombre DNS de Docker,
      # solo resoluble dentro de network-cjhirashi-srv). nginx lo usa como
      # upstream para proxyear /sse y /messages/ al servidor MCP,
      # exponiendo todo bajo el mismo origen que el frontend (sin CORS).
      - MCP_UPSTREAM=mcp_tools_server:8000
      - MCP_SSE_PATH=/sse
      - MCP_FILES_BASE_PATH=/files
    depends_on:
      - mcp-tools

networks:
  network-cjhirashi-srv:
    external: true