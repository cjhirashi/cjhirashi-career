# ============================================================================
# cjhirashi-career — Docker Compose Orchestration
# ============================================================================
#
# Arquitectura: 4 módulos (admin, portfolio, api, mcp) + infra
# Carpetas: cjhirashi-career-admin, cjhirashi-career-portfolio,
#           cjhirashi-career-api, cjhirashi-career-mcp
# Network: network-cjhirashi-srv (externa, compartida con cjhirashi-srv)
# Volúmenes: /mnt/disco1/cjhirashi-data/cjhirashi-career-volumes/
#
# Servicios Expuestos (via reverse proxy Caddy):
#   - Admin:    cjhirashi-career-admin:8000  (host 8002)
#   - Portal:   cjhirashi-career-portfolio:8000  (host 8003)
#   - MCP:      cjhirashi-career-mcp:8000  (host 8004)
#
# Servicios Internos (red Docker):
#   - API:      cjhirashi-career-api:8001  (Bedrock + PDF WeasyPrint)
#   - Qdrant (6333), PostgreSQL (5432), MinIO (9000)

version: '3.9'

services:
  # =========================================================================
  # Admin Panel — Interface Privada para Carlos Jiménez Hirashi
  # =========================================================================
  # Responsabilidad: Gestión manual de identidad, competencias, evidencia
  #                  Asistencia IA (Bedrock)
  #                  Generación de documentos (PDF)
  #
  # ESTADO: ✅ Implementado (React SPA con Vite)
  admin:
    build:
      context: ./cjhirashi-career-admin
      dockerfile: Dockerfile
    container_name: cjhirashi-career-admin
    restart: unless-stopped
    ports:
      - "8002:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================================
  # Portal Público — Portafolio (About, Proyectos, Blog, Contacto)
  # =========================================================================
  # Responsabilidad: Lectura de datos públicos
  #
  # ESTADO: ✅ Implementado (React SPA con Vite)
  portfolio:
    build:
      context: ./cjhirashi-career-portfolio
      dockerfile: Dockerfile
    container_name: cjhirashi-career-portfolio
    restart: unless-stopped
    ports:
      - "8003:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - VITE_API_URL=/api
      - VITE_TRACKING_ENABLED=true
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================================
  # MCP Server — cjhirashi-career-mcp (FastMCP, puerto 8004)
  # =========================================================================
  # Caddy: mcp.cjhirashi.com → cjhirashi-career-mcp:8000 (SSE, flush_interval -1)
  mcp:
    build:
      context: ./cjhirashi-career-mcp
      dockerfile: Dockerfile
    container_name: cjhirashi-career-mcp
    restart: unless-stopped
    ports:
      - "8004:8000"
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================================
  # API REST — Orquestación Central
  # =========================================================================
  # Responsabilidad: CRUD de datos
  #                  Autenticación y autorización
  #                  Validación de negocio
  #                  Único escritor en PostgreSQL
  #
  # INTERNO: No expuesto (accesible solo desde red Docker)
  api:
    build:
      context: ./cjhirashi-career-api
      dockerfile: Dockerfile
    container_name: cjhirashi-career-api
    restart: unless-stopped
    networks:
      - network-cjhirashi-srv
    volumes:
      - /mnt/disco1/cjhirashi-data/cjhirashi-career-volumes/uploads:/app/uploads:rw
    env_file: .env
    environment:
      # Base de datos
      DATABASE_URL: ${DATABASE_URL}
      # Autenticación
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Aplicación
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      DEBUG: ${DEBUG}
      UPLOADS_DIR: ${UPLOADS_DIR}
      # AWS Bedrock — Converse API. Ver docs/BEDROCK-SYSTEM.md
      BEDROCK_REGION: ${BEDROCK_REGION}
      BEDROCK_DEFAULT_MODEL_ID: ${BEDROCK_DEFAULT_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_ORCHESTRATOR_MODEL_ID: ${BEDROCK_ORCHESTRATOR_MODEL_ID:-us.amazon.nova-pro-v1:0}
      BEDROCK_IMAGE_MODEL_ID: ${BEDROCK_IMAGE_MODEL_ID:-amazon.titan-image-generator-v2:0}
      BEDROCK_MAX_IMAGES_PER_DAY: ${BEDROCK_MAX_IMAGES_PER_DAY:-20}
      BEDROCK_DAILY_BUDGET_USD: ${BEDROCK_DAILY_BUDGET_USD:-5.0}
      BEDROCK_MAX_ROUND_TRIPS: ${BEDROCK_MAX_ROUND_TRIPS:-6}
      BEDROCK_HISTORY_WINDOW: ${BEDROCK_HISTORY_WINDOW:-20}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Qdrant (base de conocimiento local de Agent Bedrock)
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      # MinIO (bucket de archivos). Hostname MUST be the Compose service
      # name (`minio`), not localhost and not interpolated from host .env:
      # a developer MINIO_ENDPOINT=localhost:9000 (pytest on the host)
      # leaking into this container makes ensure_bucket() fail, uvicorn
      # exits, and Cloudflare returns 520 on every /api request.
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # LinkedIn OAuth (Share on LinkedIn + Sign In with LinkedIn OIDC)
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI}
      LINKEDIN_FRONTEND_URL: ${LINKEDIN_FRONTEND_URL}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-mx}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      # Public portal (unauthenticated /public/* routes)
      PUBLIC_PORTAL_USER_ID: ${PUBLIC_PORTAL_USER_ID}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # =========================================================================
  # Qdrant — Base de Conocimiento Vectorial de Agent Bedrock
  # =========================================================================
  # Responsabilidad: búsqueda semántica sobre las metodologías operativas y
  #   los registros de las ~30 tablas de carrera (ver services/qdrant_service.py
  #   y repositories/career_repository.py, que la mantiene sincronizada).
  #   Instancia privada de este proyecto (no compartida con otros proyectos
  #   de Charlie, ej. Synapse, que corre su propio Qdrant aislado).
  #
  # INTERNO: No expuesto (accesible solo desde red Docker)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    networks:
      - network-cjhirashi-srv
    volumes:
      - /mnt/disco1/cjhirashi-data/cjhirashi-career-volumes/qdrant:/qdrant/storage:rw

  # =========================================================================
  # PostgreSQL — Base de Datos Centralizada (única fuente de verdad)
  # =========================================================================
  # Responsabilidad: Persistencia de todos los datos del sistema
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Script de inicialización
      - ./cjhirashi-career-api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persistencia de datos
      - /mnt/disco1/cjhirashi-data/cjhirashi-career-volumes/postgres:/var/lib/postgresql/data:rw
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # MinIO — Almacenamiento de objetos (bucket S3-compatible)
  # =========================================================================
  # Responsabilidad: Archivos subidos desde Admin Panel (imágenes, documentos)
  #   con links públicos para referenciar en campos Markdown. Expuesto
  #   públicamente vía Caddy (ver servicios-externos/cjhirashi-career.md)
  #   solo el puerto de la API S3 (9000) - la consola de administración
  #   (9001) se queda interna, sin exponer.
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Misma raíz de disco que Postgres, en su propia carpeta.
      - /mnt/disco1/cjhirashi-data/cjhirashi-career-volumes/minio:/data:rw
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================================================================
# Volúmenes
# ============================================================================
# Nota: Volúmenes de base de datos y uploads están en ruta absoluta
#       por coherencia con cjhirashi-srv y para persistencia en disco compartido

volumes: {}

# ============================================================================
# Redes
# ============================================================================
# network-cjhirashi-srv: Red Docker bridge EXTERNA
#   - Compartida con cjhirashi-srv (Caddy + Cloudflare)
#   - Permite acceso desde reverse proxy
#   - Aislada de internet directa (solo via Caddy)

networks:
  network-cjhirashi-srv:
    external: true
