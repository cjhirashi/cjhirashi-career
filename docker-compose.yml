services:
  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - /mnt/disco2/cjhirashi-data/mcp-outputs:/mnt/disco2/cjhirashi-data/mcp-outputs
    networks:
      - network-cjhirashi-srv
    environment:
      - PYTHONUNBUFFERED=1
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

networks:
  network-cjhirashi-srv:
    external: true