services:
  mcp-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    ports:
      - "8002:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - PYTHONUNBUFFERED=1
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

  mcp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "8003:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - APP_NAME=MCP Tools Server
      - API_UPSTREAM=mcp_api:8001
      - PDF_GENERATOR_URL=http://pdf-generator:8080
    depends_on:
      - mcp-api

  postgres:
    image: postgres:15-alpine
    container_name: mcp_postgres
    restart: unless-stopped
    env_file: .env.local
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /mnt/disco1/cjhirashi-data/portafolio-cjhirashi-volumes/postgres:/var/lib/postgresql/data
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mcp_api
    restart: unless-stopped
    ports:
      - "8004:8001"
    volumes:
      - /mnt/disco1/cjhirashi-data/portafolio-cjhirashi-volumes/uploads:/app/uploads:rw
    networks:
      - network-cjhirashi-srv
    env_file: .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      DEBUG: ${DEBUG}
      UPLOADS_DIR: ${UPLOADS_DIR}
      BEDROCK_REGION: ${BEDROCK_REGION}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
    depends_on:
      postgres:
        condition: service_healthy

volumes:

networks:
  network-cjhirashi-srv:
    external: true