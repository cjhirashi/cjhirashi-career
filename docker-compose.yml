services:
  mcp-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - /mnt/disco2/cjhirashi-data/mcp-outputs:/mnt/disco2/cjhirashi-data/mcp-outputs
    networks:
      - network-cjhirashi-srv
    environment:
      - PYTHONUNBUFFERED=1
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

  mcp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "8003:8000"
    volumes:
      # Solo lectura: nginx sirve los PDFs generados por mcp-tools bajo
      # /files/<carpeta>/ (ver frontend/nginx.conf.template) sin necesidad
      # de un endpoint HTTP adicional en server.py.
      - /mnt/disco2/cjhirashi-data/mcp-outputs:/mnt/disco2/cjhirashi-data/mcp-outputs:ro
    networks:
      - network-cjhirashi-srv
    environment:
      - APP_NAME=MCP Tools Server
      # Host:puerto INTERNO del contenedor mcp-tools (nombre DNS de Docker,
      # solo resoluble dentro de network-cjhirashi-srv). nginx lo usa como
      # upstream para proxyear /sse y /messages/ al servidor MCP,
      # exponiendo todo bajo el mismo origen que el frontend (sin CORS).
      - MCP_UPSTREAM=mcp_tools_server:8000
      - MCP_SSE_PATH=/sse
      - MCP_FILES_BASE_PATH=/files
      - API_UPSTREAM=mcp_api:8001
    depends_on:
      - mcp-tools
      - mcp-api

  postgres:
    image: postgres:15-alpine
    container_name: mcp_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcpuser
      - POSTGRES_PASSWORD=mcppass123
      - POSTGRES_DB=mcp_db
    volumes:
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpuser -d mcp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mcp_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - network-cjhirashi-srv
    environment:
      - DATABASE_URL=postgresql+asyncpg://mcpuser:mcppass123@postgres:5432/mcp_db
      - SECRET_KEY=mcp-secret-key-change-in-production-32chars-min-recommended-for-jwt
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:8003,http://mcp_frontend:8000,http://localhost:3000
      - APP_NAME=MCP Tools API
      - APP_VERSION=1.0.0
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  network-cjhirashi-srv:
    external: true