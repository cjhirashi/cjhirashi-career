services:
  mcp-tools:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    ports:
      - "8002:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - PYTHONUNBUFFERED=1
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

  mcp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "8003:8000"
    networks:
      - network-cjhirashi-srv
    environment:
      - APP_NAME=MCP Tools Server
      - API_UPSTREAM=mcp_api:8001
      - PDF_GENERATOR_URL=http://pdf-generator:8080
    depends_on:
      - mcp-api

  postgres:
    image: postgres:15-alpine
    container_name: mcp_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcpuser
      - POSTGRES_PASSWORD=mcppass123
      - POSTGRES_DB=mcp_db
    volumes:
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /mnt/disco1/cjhirashi-data/portafolio-cjhirashi-volumes/postgres:/var/lib/postgresql/data
    networks:
      - network-cjhirashi-srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpuser -d mcp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mcp_api
    restart: unless-stopped
    ports:
      - "8004:8001"
    volumes:
      - /mnt/disco1/cjhirashi-data/portafolio-cjhirashi-volumes/uploads:/app/uploads:rw
    networks:
      - network-cjhirashi-srv
    environment:
      DATABASE_URL: postgresql+asyncpg://mcpuser:mcppass123@postgres:5432/mcp_db
      SECRET_KEY: mcp-secret-key-change-in-production-32chars-min
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:8003 http://mcp_frontend:8000 http://localhost:3000"
      APP_NAME: MCP Tools API
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      UPLOADS_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:

networks:
  network-cjhirashi-srv:
    external: true