<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="gradient-cyan-docs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a5f75;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sección Azul Degradada (Cyan → Teal) -->
  <rect width="1200" height="260" fill="url(#gradient-cyan-docs)" />

  <!-- Sección Gris (Footer) -->
  <rect y="260" width="1200" height="40" fill="#4A4A4A" />

  <!-- ============================================ -->
  <!-- TEXTO CENTRADO -->
  <!-- ============================================ -->

  <!-- Línea 1: Título "Documentación" -->
  <text x="600" y="110" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Documentación
  </text>

  <!-- Línea 2: Descripción "MCP Tools Server" -->
  <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="300" fill="white" fill-opacity="0.9" text-anchor="middle">
    MCP Tools Server
  </text>

  <!-- Línea divisor sutil -->
  <line x1="12" y1="190" x2="1188" y2="190" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round" />

  <!-- Línea 3: Tipo de documento "DOCS" (40px BOLD) -->
  <text x="600" y="235" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">
    DOCS
  </text>

  <!-- ============================================ -->
  <!-- FOOTER (Gris) - Tecnologías de Docs -->
  <!-- ============================================ -->
  <text x="600" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="white" text-anchor="middle">
    Markdown • HTML/CSS • Mermaid • SVG • Git
  </text>
</svg>
