  <!-- Título Principal -->
  <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Documentación
  </text>

  <!-- Descripción -->
  <text x="600" y="165" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="300" fill="white" fill-opacity="0.9" text-anchor="middle">
    MCP Tools Server
  </text>

  <!-- Tecnologías (Footer) -->
  <text x="600" y="288" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="white" text-anchor="middle">
    Guías • Ejemplos • Configuración • Troubleshooting
