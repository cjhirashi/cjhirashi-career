<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="gradient-cyan-teal-docs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sección Azul (Gradiente Cyan → Teal) -->
  <rect width="1200" height="260" fill="url(#gradient-cyan-teal-docs)" />

  <!-- Sección Naranja (Tecnologías) -->
