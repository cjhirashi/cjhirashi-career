# Kubernetes Deployment for IA Service (FASE 7)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cjhirashi-career-ia
  labels:
    app: ia-service
    version: v1

spec:
  replicas: 3
  selector:
    matchLabels:
      app: ia-service
  template:
    metadata:
      labels:
        app: ia-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/api/metrics/prometheus"
    spec:
      containers:
      - name: ia-service
        image: cjhirashi-career-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8010
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ia-service-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: ia-service-config
              key: redis-url
        - name: ORCHESTRATOR_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ia-service-config
              key: orchestrator-url
        - name: DEBUG
          value: "false"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ia-service
  labels:
    app: ia-service

spec:
  type: ClusterIP
  ports:
  - port: 8010
    targetPort: 8010
    protocol: TCP
    name: http
  selector:
    app: ia-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia-service-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cjhirashi-career-ia
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
